[package]
name = "steam-image-browser"
version = "0.1.0"
description = "SteamImageBrowser"
authors = ["linmingqi"]
edition = "2021"

[lib]
name = "steam_image_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
mime_guess = "2"
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
